        </div>
        <div class="navbar-section navbar-center">
            <span class="navbar-logo" tabindex="0" style="user-select:none;">🍽️ MAP PICK</span>
        </div>
        <div class="navbar-section navbar-right">
            <button class="navbar-icon" onclick="goToAlarmPage()" title="알림" aria-label="알림">🔔</button>
            <button class="navbar-icon" onclick="goToProfilePage()" title="내 프로필" aria-label="프로필">👤</button>
        </div>
