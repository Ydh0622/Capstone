    <div class="container">
        <h2>맛집 & 관광지 추천</h2>
        <div id="kakaoUserInfo"></div>


        <div style="margin:10px 0;">
            <label for="location" style="font-weight:bold;">위치</label>
            <input type="text" id="location" placeholder="위치를 입력하세요" aria-label="검색 위치 입력" />
            <button onclick="searchPlaces()" aria-label="검색">검색</button>
            <button onclick="getCurrentLocation()" aria-label="현재 위치로 검색">현재 위치</button>
