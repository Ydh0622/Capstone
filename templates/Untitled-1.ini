            <option value="all">전체</option>
            <option value="FD6">음식점</option>
            <option value="CE7">카페</option>
            <option value="FD1">패스트푸드</option>
            <option value="AG2">바</option>
            <option value="AT4">관광지</option>
            <option value="AD5">호텔</option>
            <option value="CT1">문화시설</option>
        </select>


        <!-- 로딩 스피너 -->
        <div id="loadingSpinner" style="display:none; margin:20px 0;">
            <div class="spinner"></div>
            <span style="color:#555;">로딩 중...</span>
        </div>


        <div id="map" tabindex="0" aria-label="지도" style="width:100%; height:500px; margin-top:15px;"></div>
        <div id="results"></div>
    </div>


    <script>
        // ==== 햄버거 메뉴 ====
        let sidebarActive = false;
        function toggleSidebar() {
            sidebarActive = !sidebarActive;
            document.getElementById("sidebarMenu").style.display = sidebarActive ? "flex" : "none";
            if (sidebarActive) positionSidebar();
            showUserSidebarMenu();
        }
        function closeSidebar() {
            sidebarActive = false;
            document.getElementById("sidebarMenu").style.display = "none";
        }
        function positionSidebar() {
            const sidebar = document.getElementById("sidebarMenu");
            const btn = document.querySelector(".navbar-toggle");
            const rect = btn.getBoundingClientRect();
            sidebar.style.position = "absolute";
            sidebar.style.left = window.scrollX + rect.left + "px";
            sidebar.style.top = window.scrollY + rect.bottom + "px";
        }
        window.addEventListener("resize", () => {
            if (sidebarActive) positionSidebar();
        });


        // ==== 접근성 ====
        window.onclick = function (event) {
            const modal = document.getElementById("loginModal");
            if (modal.style.display === "flex" && event.target === modal) closeLoginModal();
            if (
                sidebarActive &&
                !event.target.closest("#sidebarMenu") &&
                !event.target.closest(".navbar-toggle")
            )
                closeSidebar();
        };
        window.onkeydown = function (event) {
            if (event.key === "Escape") {
                closeLoginModal();
                closeSidebar();
            }
        };


        // ==== 카카오 로그인 & 유저정보 ====
        Kakao.init("4c83242f0f62aba9cc823dfc390f5c34");
        let kakaoUser = null;
        let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
        let lastSearchedPlaces = [];


        function showUserInfo() {
            const userDiv = document.getElementById("kakaoUserInfo");
            const sLoginBtn = document.getElementById("sidebarLoginBtn");
            const sLogoutBtn = document.getElementById("sidebarLogoutBtn");
            if (kakaoUser && kakaoUser.kakao_account) {
                const nickname = kakaoUser.kakao_account.profile.nickname;
                userDiv.innerHTML = `<b>안녕하세요, ${nickname}님!</b>`;
                if (sLoginBtn) sLoginBtn.style.display = "none";
                if (sLogoutBtn) sLogoutBtn.style.display = "block";
            } else {
                userDiv.innerHTML = "";
                if (sLoginBtn) sLoginBtn.style.display = "block";
                if (sLogoutBtn) sLogoutBtn.style.display = "none";
            }
        }
        function showUserSidebarMenu() {
            showUserInfo();
        }
        function loginWithKakao() {
            showLoading(true,"카카오 로그인중...");
            Kakao.Auth.login({
                success: function(authObj) {
                    Kakao.Auth.setAccessToken(authObj.access_token);
                    getUserInfo();
                    closeLoginModal();
                },
                fail: function(err) {
                    alert('카카오 로그인 실패: ' + JSON.stringify(err));
                    showLoading(false);
                }
            });
        }
        function getUserInfo() {
            Kakao.API.request({
                url: '/v2/user/me',
                success: function(res) {
                    kakaoUser = res;
                    showUserInfo();
                    loadFavoritesForUser();
                    showLoading(false);
                },
                fail: function(error) {
                    alert('사용자 정보 요청 실패: ' + JSON.stringify(error));
                    showLoading(false);
                }
            });
        }
        function kakaoLogout() {
            Kakao.Auth.logout(function() {
                kakaoUser = null;
                showUserInfo();
                favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
                showPlacesOnMap(lastSearchedPlaces);
            });
        }
        function checkKakaoLoginStatus() {
            if (Kakao.Auth.getAccessToken()) {
                getUserInfo();
            } else {
                showUserInfo();
            }
        }
        function loadFavoritesForUser() {
            if (kakaoUser && kakaoUser.id) {
                const key = "favorites_" + kakaoUser.id;
                favorites = JSON.parse(localStorage.getItem(key) || "[]");
                showPlacesOnMap(lastSearchedPlaces);
            }
        }
        function saveFavoritesForUser() {
            if (kakaoUser && kakaoUser.id) {
                const key = "favorites_" + kakaoUser.id;
                localStorage.setItem(key, JSON.stringify(favorites));
            } else {
                localStorage.setItem("favorites", JSON.stringify(favorites));
            }
        }


        // ==== 지도/검색/로딩 UX ====
        let map, ps, mapInitialized = false, currentMarkers = [];
        let currentRoute = null, currentPosition = null, selectedItem = null, searchCircle = null;


        function initializeMap() {
            if (mapInitialized) return;
            map = new kakao.maps.Map(document.getElementById('map'), {
                center: new kakao.maps.LatLng(37.5665, 126.9780),
                level: 5
            });
            ps = new kakao.maps.services.Places();
            mapInitialized = true;
        }


        function showLoading(show, msg) {
            const spinner = document.getElementById("loadingSpinner");
            spinner.style.display = show ? "block" : "none";
            if (show && msg) spinner.querySelector("span").textContent = msg;
            else if(spinner.querySelector("span")) spinner.querySelector("span").textContent = "로딩 중...";
        }


        // === 메인 기능 ===
        function searchPlaces() {
            const location = document.getElementById("location").value.trim();
            if (!location) { alert("위치를 입력하세요."); return; }
            showLoading(true, "지도 위치 찾는 중...");
            ps.keywordSearch(location, function(data, status) {
                if (status === kakao.maps.services.Status.OK) {
                    const lat = parseFloat(data[0].y);
                    const lon = parseFloat(data[0].x);
                    currentPosition = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(currentPosition);
                    new kakao.maps.Marker({ map: map, position: currentPosition, title: "검색한 위치" });
                    showCircleRadius(lat, lon, document.getElementById("radiusSlider").value);
                    searchNearby(lat, lon);
                } else {
                    showPlacesOnMap([]);
                    showLoading(false);
                    alert("장소를 찾을 수 없습니다.");
                }
            });
        }
        function getCurrentLocation() {
            if (!navigator.geolocation) { alert("이 브라우저에서는 위치 정보를 지원하지 않습니다."); return; }
            showLoading(true, "위치 정보 탐색 중...");
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude, lon = position.coords.longitude;
                    currentPosition = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(currentPosition);
                    new kakao.maps.Marker({map: map, position: currentPosition, title:"현재 위치"});
                    showCircleRadius(lat, lon, document.getElementById("radiusSlider").value);
                    searchNearby(lat, lon);
                },
                function(error) {
                    showLoading(false);
                    switch(error.code) {
                        case error.PERMISSION_DENIED: alert("위치 권한이 필요합니다."); break;
                        case error.POSITION_UNAVAILABLE: alert("위치 정보를 받을 수 없습니다."); break;
                        case error.TIMEOUT: alert("위치 정보 요청이 시간초과되었습니다."); break;
                        default: alert("알 수 없는 위치 오류 발생"); break;
                    }
                }
            );
        }
        function searchNearby(lat, lon) {
            const radius = document.getElementById("radiusSlider").value;
            const category = document.getElementById("categorySelect").value;
            showLoading(true, "주변 장소 탐색 중...");
            ps.categorySearch(category === "all" ? "" : category, function(data, status) {
                showLoading(false);
                if (status === kakao.maps.services.Status.OK) {
                    const filtered = data.filter(place => {
                        const dist = getDistanceFromLatLon(lat, lon, parseFloat(place.y), parseFloat(place.x)) * 1000;
                        return dist <= radius;
                    });
                    showPlacesOnMap(filtered);
                } else {
                    showPlacesOnMap([]);
                }
            }, {location: new kakao.maps.LatLng(lat, lon), radius: radius});
        }
        function updateRadius() {
            const radius = document.getElementById("radiusSlider").value;
            document.getElementById("radiusValue").innerText = radius + "m";
            if (currentPosition) {
                showCircleRadius(currentPosition.getLat(), currentPosition.getLng(), radius);
                searchNearby(currentPosition.getLat(), currentPosition.getLng());
            }
        }
        function showCircleRadius(lat, lon, radius) {
            if (searchCircle) searchCircle.setMap(null);
            searchCircle = new kakao.maps.Circle({
                center: new kakao.maps.LatLng(lat, lon),
                radius: parseInt(radius),
                strokeWeight: 2,
                strokeColor: '#007BFF',
                strokeOpacity: 1,
                fillColor: '#007BFF',
                fillOpacity: 0.2,
                map: map
            });
            if (!selectedItem) map.setBounds(searchCircle.getBounds());
        }
        function showPlacesOnMap(places) {
            lastSearchedPlaces = places;
            const resultsDiv = document.getElementById("results");
            resultsDiv.innerHTML = "";
            currentMarkers.forEach(markerObj => {
                if (markerObj.marker) markerObj.marker.setMap(null);
                if (markerObj.infowindow) markerObj.infowindow.close();
            });
            currentMarkers = [];
            if (places.length === 0) {
                resultsDiv.innerHTML = "<p style='color:#a00'>반경 내 장소가 없습니다 😥</p>";
                return;
            }
            const countInfo = document.createElement("p");
            countInfo.innerHTML = `검색 결과: <b>${places.length}</b> 개`;
            resultsDiv.appendChild(countInfo);


            places.forEach(place => {
                if (place.y && place.x) {
                    const name = place.place_name || "이름 없음";
                    if (!place.id) place.id = place.place_id || `${place.y}_${place.x}`;
                    const marker = new kakao.maps.Marker({ map, position: new kakao.maps.LatLng(place.y, place.x), title: name });
                    const infowindow = new kakao.maps.InfoWindow({ content: `<div style="padding:5px;white-space:nowrap;">${name}</div>` });
                    infowindow.open(map, marker);
                    currentMarkers.push({ marker, infowindow });


                    const item = document.createElement("div");
                    item.className = "result-item";
                    item.style.cursor = "pointer";
                    item.tabIndex = 0;


                    const nameSpan = document.createElement("span");
                    nameSpan.textContent = name;
                    nameSpan.style.fontWeight = "bold";
                    item.appendChild(nameSpan);


                    if (place.category_name) {
                        const category = document.createElement("span");
                        category.textContent = " (" + place.category_name.split('>').pop().trim() + ")";
                        category.style.fontSize = "13px";
                        category.style.color = "#0a6";
                        item.appendChild(category);
                    }
                    item.appendChild(document.createElement("br"));
                    if (place.road_address_name) {
                        const addr = document.createElement("span");
                        addr.textContent = "🏠 " + place.road_address_name;
                        addr.style.fontSize = "14px";
                        item.appendChild(addr);
                        item.appendChild(document.createElement("br"));
                    }
                    if (place.phone) {
                        const tel = document.createElement("span");
                        tel.textContent = "☎ " + place.phone + " ";
                        tel.style.fontSize = "13px";
                        item.appendChild(tel);
                    }
                    if(place.place_url) {
                        const link = document.createElement("a");
                        link.href = place.place_url;
                        link.target = "_blank";
                        link.rel = "noopener";
                        link.textContent = "상세보기";
                        link.style.marginLeft = "9px";
                        link.style.fontSize = "13px";
                        link.style.color = "#007BFF";
                        link.style.textDecoration = "underline";
                        item.appendChild(link);
                    }


                    const favBtn = document.createElement("button");
                    favBtn.textContent = "★";
                    favBtn.title = "즐겨찾기";
                    favBtn.setAttribute("aria-label", "즐겨찾기");
                    favBtn.className = "fav-btn " + (favorites.find(fav => fav.id === place.id) ? "gold" : "gray");
                    favBtn.onclick = (e) => {
                        e.stopPropagation();
                        toggleFavorite(place);
                    };
                    item.appendChild(favBtn);


                    const routeBtn = document.createElement("button");
                    routeBtn.textContent = "길찾기";
                    routeBtn.title = "길찾기 페이지(Map.html)으로 이동";
                    routeBtn.style.marginLeft = "9px";
                    routeBtn.onclick = (e) => {
                        e.stopPropagation();
                        const srcLat = currentPosition ? currentPosition.getLat() : "";
                        const srcLng = currentPosition ? currentPosition.getLng() : "";
                        openMapHtmlRoute(
                            place.place_name, place.y, place.x,
                            srcLat && srcLng ? "내위치" : "", srcLat, srcLng
                        );
                    };
                    item.appendChild(routeBtn);


                    item.onclick = () => { selectResultItem(marker, infowindow, item, place); };
                    item.onkeypress = e => { if(e.key === 'Enter' || e.key === ' ') item.onclick(); };


                    resultsDiv.appendChild(item);
                }
            });
        }
        function selectResultItem(marker, infowindow, item, place) {
            const name = place.place_name || "";
            const placeLatLng = new kakao.maps.LatLng(place.y, place.x);
            infowindow.setContent(`<div style="padding:5px;">${name}</div>`);
            infowindow.open(map, marker);
            if (selectedItem) selectedItem.classList.remove("selected");
            item.classList.add("selected");
            selectedItem = item;
            if (currentRoute) { currentRoute.setMap(null);}
            if (currentPosition) {
                currentRoute = new kakao.maps.Polyline({
                    map: map,
                    path: [currentPosition, placeLatLng],
                    strokeWeight: 4,
                    strokeColor: 'blue',
                    strokeOpacity: 0.7
                });
                const distance = getDistanceFromLatLon(currentPosition.getLat(), currentPosition.getLng(), parseFloat(place.y), parseFloat(place.x));
                const walkingTime = Math.round((distance / 4.8) * 60);
                infowindow.setContent(
                    `<div style="padding:5px;">${name}<br>거리: ${(distance*1000).toFixed(0)}m <br>도보: 약 ${walkingTime}분</div>`
                );
                const bounds = new kakao.maps.LatLngBounds();
                bounds.extend(currentPosition); bounds.extend(placeLatLng);
                if (searchCircle) {
                    bounds.extend(searchCircle.getBounds().getSouthWest());
                    bounds.extend(searchCircle.getBounds().getNorthEast());
                }
                map.setBounds(bounds);
            } else {
                map.setCenter(placeLatLng);
                map.setLevel(3);
            }
        }


        function toggleFavorite(place) {
            if (!place.id) place.id = place.place_id || `${place.y}_${place.x}`;
            const idx = favorites.findIndex(fav => fav.id === place.id);
            if (idx === -1) {
                favorites.push(place);
            } else {
                favorites.splice(idx, 1);
            }
            saveFavoritesForUser();
            showPlacesOnMap(lastSearchedPlaces);
        }
        function showFavorites() {
            showPlacesOnMap(favorites);
            closeSidebar();
        }


        function openMapHtmlRoute(destName, destLat, destLng, srcName, srcLat, srcLng) {
            const params = new URLSearchParams({
                srcName: srcName || "",
                srcLat: srcLat || "",
                srcLng: srcLng || "",
                destName: destName || "",
                destLat: destLat || "",
                destLng: destLng || ""
            }).toString();
            // 페이지 이동 (현재 창)
            window.location.href = "/Map.html?" + params;
        }


        function getDistanceFromLatLon(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }
        function deg2rad(deg) {
            return deg * (Math.PI / 180);
        }


        // 페이지 이동
        function goToAlarmPage() { window.location.href = "/alarm"; }
        function goToProfilePage() {
            if (kakaoUser && kakaoUser.kakao_account) window.location.href = "/profile";
            else openLoginModal();
        }
        function goToReviewPage() { window.location.href = "/review"; }
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "flex";
            closeSidebar();
        }
        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }


        // 초기 실행
        window.onload = function(){
            initializeMap();
            checkKakaoLoginStatus();
            showLoading(false);
        }
    </script>
</body>
